apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-test-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-test-pod
spec:
  nodeSelector:
    node-role.kubernetes.io/cpu-worker: ""
  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-c", "echo 'EBS volume works!' > /data/test.txt && cat /data/test.txt && sleep 300"]
      volumeMounts:
        - mountPath: /data
          name: ebs-vol
  volumes:
    - name: ebs-vol
      persistentVolumeClaim:
        claimName: ebs-test-pvc
  restartPolicy: Never
